# Knowledge check for Module NN — <Topic>
# The tutor reads this file and asks ONE question at a time, never the whole list.
# Grade against `expected_keywords` (or use LlmAsJudge with `accept_paraphrase: true`).
# Record pass/fail per question id back into PROGRESS.md and student_profile.md.

module: NN_Topic
page: 07_KnowledgeCheck

questions:
  - id: q1
    prompt: "<one-sentence question about concept 1 from this module>"
    expected_keywords: [<keyword1>, <keyword2>]
    accept_paraphrase: true
    difficulty: easy

  - id: q2
    prompt: "<one-sentence question about concept 2>"
    expected_keywords: [<keyword>, <keyword>]
    accept_paraphrase: true
    difficulty: easy

  - id: q3
    prompt: "<one-sentence question that requires connecting two concepts>"
    expected_keywords: [<keyword>, <keyword>]
    accept_paraphrase: true
    difficulty: medium

  - id: q4
    prompt: "<one-sentence question about the In Production gotcha>"
    expected_keywords: [<keyword>, <keyword>]
    accept_paraphrase: true
    difficulty: medium

  - id: q5
    prompt: "<one-sentence question that probes the deepest concept of the module>"
    expected_keywords: [<keyword>, <keyword>]
    accept_paraphrase: true
    difficulty: hard

  # 5–7 questions total. All answerable in one sentence.
  # Add q6/q7 only if the module has enough surface to justify them.
