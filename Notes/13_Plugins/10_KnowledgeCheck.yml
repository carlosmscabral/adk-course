module: 13_Plugins
questions:
  - id: q1
    prompt: "How is a Plugin different from a Callback?"
    expected_keywords: [runner, scope, cross-cutting, all agents, callback per-agent]
    accept_paraphrase: true
    difficulty: easy
  - id: q2
    prompt: "Name three built-in plugins ADK ships and what each does."
    expected_keywords: [LoggingPlugin, ReflectAndRetryToolPlugin, ContextFilterPlugin, GlobalInstructionPlugin, BigQueryAgentAnalyticsPlugin]
    accept_paraphrase: true
    difficulty: medium
  - id: q3
    prompt: "Why does plugin order matter?"
    expected_keywords: [mutate, hot path, fire in order, log filtered vs raw, correctness]
    accept_paraphrase: true
    difficulty: medium
  - id: q4
    prompt: "When would you use ReflectAndRetryToolPlugin, and when would you NOT?"
    expected_keywords: [LLM arg error, retry, fixable, NOT for auth failure, NOT for non-idempotent]
    accept_paraphrase: true
    difficulty: medium
  - id: q5
    prompt: "What's the bridge from plugins to the Observability module?"
    expected_keywords: [BigQueryAgentAnalyticsPlugin, telemetry, queryable, offline, analytics]
    accept_paraphrase: true
    difficulty: easy
  - id: q6
    prompt: "What's the contract for a method on a custom BasePlugin subclass?"
    expected_keywords: [async def, name, short-circuit, return None, observe-vs-mutate]
    accept_paraphrase: true
    difficulty: medium
  - id: q7
    prompt: "Why is a plugin that does `except Exception: pass` dangerous?"
    expected_keywords: [silent, ghost failure, audit hole, PII leak, surface, re-raise]
    accept_paraphrase: true
    difficulty: hard
