# Knowledge check for Module 1A — App & Runner Architecture
# Tutor reads this file and asks ONE question at a time, never the whole list.
# Grade against `expected_keywords` (or use LlmAsJudge with `accept_paraphrase: true`).

module: 1A_AppAndRunner
page: 10_KnowledgeCheck

questions:
  - id: q1
    prompt: "In ADK 2.0, what does `App(...)` own that `Runner(...)` does not?"
    expected_keywords: [plugins, events_compaction_config, context_cache_config, resumability_config, root_agent, name]
    accept_paraphrase: true
    difficulty: easy

  - id: q2
    prompt: "Why is `session_service` a `Runner` kwarg and not a field on `App`?"
    expected_keywords: [runtime, live resource, connection, DB pool, not serializable, per-process]
    accept_paraphrase: true
    difficulty: medium

  - id: q3
    prompt: "What is the lifetime difference between `app:`-prefixed state and `user:`-prefixed state?"
    expected_keywords: [app-wide, every user, cross-user, per user, all sessions, feature flag]
    accept_paraphrase: true
    difficulty: medium

  - id: q4
    prompt: "Where do `on_startup` and `on_shutdown` hooks live in an ADK 2.0 deployment, given that `App` does not expose those kwargs directly?"
    expected_keywords: [FastAPI, lifespan, asynccontextmanager, adk api_server, wrapping runtime, asyncio main]
    accept_paraphrase: true
    difficulty: medium

  - id: q5
    prompt: "Why does turning on `ResumabilityConfig(is_resumable=True)` require switching off `InMemorySessionService`?"
    expected_keywords: [pause checkpoint, persisted, in-memory, process restart, lost, persistent backend]
    accept_paraphrase: true
    difficulty: medium

  - id: q6
    prompt: "If a multi-agent App has ten LlmAgents, why does `context_cache_config` live on the App rather than per-agent?"
    expected_keywords: [shared backend, cache key, prefix overlap, operational, deploy-wide, uniform]
    accept_paraphrase: true
    difficulty: hard

  - id: q7
    prompt: "Given `EventsCompactionConfig(compaction_interval=20, overlap_size=4)`, after 25 user-initiated invocations how many compactions have fired and how many raw invocations are still in the session?"
    expected_keywords: [one compaction, 9 raw, 1..16 summarized, 17..25 raw, next at 40]
    accept_paraphrase: true
    difficulty: hard
