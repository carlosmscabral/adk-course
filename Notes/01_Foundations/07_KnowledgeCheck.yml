module: 01_Foundations
questions:
  - id: q1
    prompt: "In one sentence: what is the agent loop?"
    expected_keywords: [LLM, tool, reply, loop, until]
    accept_paraphrase: true
    difficulty: easy
  - id: q2
    prompt: "Name the three runtime primitives and what each owns."
    expected_keywords: [Runner, Session, Event, orchestrator, history, state, log]
    accept_paraphrase: true
    difficulty: easy
  - id: q3
    prompt: "Why is the agent itself (`LlmAgent(...)`) stateless? Where does conversation state live?"
    expected_keywords: [config, Session, events, history, state]
    accept_paraphrase: true
    difficulty: medium
  - id: q4
    prompt: "What is a `state_delta` and where does it appear?"
    expected_keywords: [event, actions, change, mutation, session, state]
    accept_paraphrase: true
    difficulty: medium
  - id: q5
    prompt: "Which session backend should you default to even in dev, and why?"
    expected_keywords: [Sqlite, DatabaseSessionService, persistence, db_url]
    accept_paraphrase: true
    difficulty: medium
  - id: q6
    prompt: "If a user asks 'what's the weather in Tokyo and Madrid?' and the agent has only a `get_weather(city)` tool, how many iterations of the agent loop will happen?"
    expected_keywords: [three, 3, tool calls, two, final reply]
    accept_paraphrase: true
    difficulty: medium
  - id: q7
    prompt: "Why does ADK split state changes into per-event deltas instead of letting tools mutate session state directly?"
    expected_keywords: [auditable, replay, rewind, persistence, event log]
    accept_paraphrase: true
    difficulty: hard
